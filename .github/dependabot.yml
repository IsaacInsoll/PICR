version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
      time: '05:00'
      timezone: America/New_York
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '05:15'
      timezone: America/New_York
    open-pull-requests-limit: 1
    cooldown:
      semver-minor-days: 21
      semver-patch-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    groups:
      npm-root:
        patterns:
          - '*'
      npm-root-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
      time: '05:30'
      timezone: America/New_York
    open-pull-requests-limit: 1
    cooldown:
      semver-minor-days: 21
      semver-patch-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    groups:
      npm-backend:
        patterns:
          - '*'
      npm-backend-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: '05:45'
      timezone: America/New_York
    open-pull-requests-limit: 1
    cooldown:
      semver-minor-days: 21
      semver-patch-days: 7
      exclude:
        - '@picr/react-grid-gallery'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    groups:
      npm-frontend:
        patterns:
          - '*'
      npm-frontend-security:
        applies-to: security-updates
        patterns:
          - '*'

  # React Native / Expo dependency upgrades are coordinated manually during app
  # maintenance, so Dependabot must not open PRs against /app at all.
  # `open-pull-requests-limit: 0` only stops *version* updates; security update
  # PRs ignore that limit, so the wildcard `ignore` rule below is what suppresses
  # them (`ignore` applies to both version and security updates).
  # Security alerts for /app remain visible in the Dependabot alerts UI.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: monthly
      time: '06:15'
      timezone: America/New_York
    open-pull-requests-limit: 1
    cooldown:
      semver-minor-days: 21
      semver-patch-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    groups:
      npm-shared:
        patterns:
          - '*'
      npm-shared-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /ping
    schedule:
      interval: monthly
      time: '06:30'
      timezone: America/New_York
    open-pull-requests-limit: 1
    cooldown:
      semver-minor-days: 21
      semver-patch-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    groups:
      npm-ping:
        patterns:
          - '*'
      npm-ping-security:
        applies-to: security-updates
        patterns:
          - '*'
