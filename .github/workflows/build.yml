# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
name: PICR Build

on:
  workflow_call:

jobs:
  build:
    name: PICR Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Show Node & npm versions
        run: |
          node -v
          npm -v
          which node
          which npm
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: '📦 [root] Install Dependencies'
        run: npm ci
      - name: '🗃️ [shared] Install Dependencies'
        run: cd shared && npm ci
      - name: '📡 [ping] Install Dependencies'
        run: cd ping && npm ci
      - name: '🎨 [format] Prettier check'
        run: npm run format:check
      - name: '🌐 [i18n] Validate locale catalogs'
        run: npm run i18n:check

      # BACKEND
      - name: '🗃️ [backend] Install Dependencies'
        run: cd backend && npm ci

      # Codegen no longer needs a running server or database, so CI can prove
      # the committed generated files still match the executable schema.
      # Runs early: it is fast and catches drift before the expensive steps.
      - name: '🔄 [codegen] Verify generated GraphQL files are up to date'
        shell: bash
        run: |
          set -euo pipefail
          npm run gql
          if ! git diff --exit-code -- schema.graphql shared/gql shared/urql/graphql.schema.json; then
            echo '::error::Generated GraphQL files are out of date. Run "npm run gql" and commit the result.'
            exit 1
          fi

      - name: '🗃️ [shared] Lint'
        run: cd shared && npm run lint
      - name: '🗃️ [shared] Type check'
        run: cd shared && npx tsc --noEmit

      # PICR PING
      - name: '📡 [ping] Lint'
        run: cd ping && npm run lint
      - name: '📡 [ping] Type check'
        run: cd ping && npm run typecheck
      - name: '📡 [ping] Unit tests'
        run: cd ping && npm test
      - name: '📡 [ping] Build'
        run: cd ping && npm run build
      - name: '📡 [ping] Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4
      - name: '📡 [ping] Build container (no push)'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ping/Dockerfile
          push: false
          build-args: |
            PICR_GIT_SHA=${{ github.sha }}
            PICR_PING_VERSION=ci
          tags: picr-ping:ci
          cache-from: type=gha,scope=picr-ping
          cache-to: type=gha,mode=max,scope=picr-ping

      - name: '🗃️ [backend] Lint'
        run: cd backend && npm run lint
      - name: '🗃️ [backend] Build (TSC + artifact files)'
        # backend build also copies drizzle migrations and backend package files into dist/
        run: cd backend && npm run build
      - name: '🗃️ [backend] Install Dependencies'
        run: cd dist && npm ci --omit=dev

      # LIGHTROOM PLUGIN (before frontend so vite copies it to dist/public/)
      - name: '🔌 [lightroom] Build plugin zip'
        run: npm run build:lightroom

      # FRONTEND
      - name: '💄 [frontend] Install Dependencies'
        run: cd frontend && npm ci
      - name: '💄 [frontend] Lint'
        run: cd frontend && npm run lint
      - name: '💄 [frontend] Type check'
        run: cd frontend && npx tsc --noEmit
      - name: '💄 [frontend] Unit tests'
        run: cd frontend && npm run test:unit
      - name: '💄 [frontend] Build (vite)'
        run: cd frontend && npm run build -- --logLevel error

      # APP
      # Not needed for artifact, just checking that it didn't break something
      # Hermes won't compile on arm so skip it
      - name: '📱 [app] Install Dependencies'
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: cd app && npm ci
      - name: '📱 [app] Lint'
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: cd app && npm run lint
      - name: '📱 [app] Type check'
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: cd app && npm run typecheck
      - name: '📱 [app] Build (expo export)'
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail
          cd app
          npx expo export --platform ios 2>&1 | awk '
            /^› (Assets|ios bundles|android bundles|web bundles|Files) \(/ { skip=1; next }
            skip && NF==0 { skip=0; next }
            skip { next }
            { print }
          '

      # TESTS
      - name: '🧪 [tests/api] run backend tests (vitest)'
        run: npm run test:api
      - name: '🧪 [tests/e2e] install playwright browser'
        shell: bash
        run: |
          set -euo pipefail
          echo "Installing Playwright Chromium..."
          if npm run test:e2e:install:ci > /tmp/playwright-install.log 2>&1; then
            echo "Playwright Chromium install succeeded."
          else
            echo "Playwright Chromium install failed. Full output:"
            cat /tmp/playwright-install.log
            exit 1
          fi
      - name: '🧪 [tests/e2e] run frontend smoke tests'
        run: npm run test:e2e

      # ARTIFACT
      - uses: actions/upload-artifact@v7
        if: ${{ !env.ACT }}
        name: '🗜️ Generate Build Artifacts'
        with:
          name: picr-build-${{ github.sha }}
          # Exclude node_modules: it is CI-host (glibc/x64) binaries that the
          # Docker image discards and reinstalls for Alpine/musl + arm64.
          # Dropping it shrinks the artifact by ~200MB (faster up/download).
          path: |
            dist/
            !dist/node_modules
          if-no-files-found: error
